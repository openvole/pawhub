<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hacker News</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#222a35;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--orange:#ff6600}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--orange)}
.feeds{display:flex;gap:4px;flex-wrap:wrap}.spacer{flex:1}
button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;text-transform:capitalize}
button:hover{border-color:var(--accent)}button.active{border-color:var(--orange);color:var(--orange)}
main{padding:10px 18px;max-width:820px;margin:0 auto}
.muted{color:var(--dim)}.empty{color:var(--dim);text-align:center;padding:44px}
.item{padding:9px 0;border-top:1px solid var(--border)}.item:first-child{border-top:none}
.title a{color:var(--text);text-decoration:none;font-size:15px}.title a:hover{color:var(--accent)}
.dom{color:var(--dim);font-size:12px;margin-left:6px}
.rank{color:var(--dim);display:inline-block;min-width:22px}
.meta{color:var(--dim);font-size:12px;margin-top:3px;margin-left:22px}
.meta a{color:var(--dim);cursor:pointer;text-decoration:none}.meta a:hover{color:var(--accent);text-decoration:underline}
.back{margin:4px 0 12px}
.story-text{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin:10px 0;white-space:pre-wrap}
.cmt{border-top:1px solid var(--border);padding:10px 0;white-space:pre-wrap;font-size:13.5px}
.cmt .who{color:var(--dim);font-size:12px;margin-bottom:4px}
</style></head>
<body>
<header>
  <h1>Hacker News</h1>
  <div class="feeds" id="feeds"></div>
  <span class="spacer"></span>
  <button onclick="loadFeed()" title="Refresh">↻</button>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
// Data comes from the paw's tools, proxied by the control plane at ./tool/<name> — no LLM in the loop.
function callTool(name, params){
  return fetch('tool/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params||{})}).then(function(r){return r.json()});
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function age(h){if(h==null)return'';if(h<1)return Math.round(h*60)+'m';if(h<24)return Math.round(h)+'h';return Math.round(h/24)+'d'}
var FEEDS=['top','new','best','ask','show'],feed='top';
function renderFeeds(){
  document.getElementById('feeds').innerHTML=FEEDS.map(function(f){
    return '<button class="'+(f===feed?'active':'')+'" onclick="setFeed(\''+f+'\')">'+f+'</button>';
  }).join('');
}
function setFeed(f){feed=f;renderFeeds();loadFeed()}
function loadFeed(){
  var m=document.getElementById('main');m.innerHTML='<div class="empty">Loading '+esc(feed)+'…</div>';
  callTool('hn_top',{feed:feed,limit:30}).then(function(res){
    var s=(res&&res.stories)||[];
    if(!s.length){m.innerHTML='<div class="empty">Nothing here.</div>';return}
    m.innerHTML=s.map(function(it,i){
      var href=it.url||('https://news.ycombinator.com/item?id='+it.id);
      return '<div class="item">'+
        '<div class="title"><span class="rank">'+(i+1)+'.</span> <a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>'+
        (it.domain?'<span class="dom">('+esc(it.domain)+')</span>':'')+'</div>'+
        '<div class="meta">'+it.score+' points · by '+esc(it.by)+' · '+age(it.ageHours)+' · <a onclick="openStory('+it.id+')">'+it.comments+' comments</a></div>'+
      '</div>';
    }).join('');
  }).catch(function(){m.innerHTML='<div class="empty">Failed to load.</div>'});
}
function openStory(id){
  var m=document.getElementById('main');m.innerHTML='<div class="empty">Loading thread…</div>';
  callTool('hn_story',{id:id}).then(function(res){
    var st=res&&res.story;if(!st){m.innerHTML='<div class="empty">Could not load.</div>';return}
    var href=st.url||('https://news.ycombinator.com/item?id='+st.id);
    var cmts=(st.topComments||[]).map(function(c){
      return '<div class="cmt"><div class="who">'+esc(c.by)+' · '+age(c.ageHours)+'</div>'+esc(c.text)+'</div>';
    }).join('');
    m.innerHTML='<div class="back"><button onclick="loadFeed()">← back</button></div>'+
      '<div class="title"><a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(st.title)+'</a>'+(st.domain?'<span class="dom">('+esc(st.domain)+')</span>':'')+'</div>'+
      '<div class="meta" style="margin-left:0">'+st.score+' points · by '+esc(st.by)+' · '+age(st.ageHours)+' · '+st.comments+' comments · <a href="https://news.ycombinator.com/item?id='+st.id+'" target="_blank" rel="noopener">on HN ↗</a></div>'+
      (st.text?'<div class="story-text">'+esc(st.text)+'</div>':'')+
      '<div style="margin-top:8px">'+(cmts||'<div class="muted">No comments yet.</div>')+'</div>';
  }).catch(function(){m.innerHTML='<div class="empty">Failed to load thread.</div>'});
}
renderFeeds();loadFeed();
</script>
</body></html>
