name: Registry

# INDEX.json is what openvole.github.io/pawhub renders and what a registry client reads. If a paw is
# added or its manifest changes without regenerating it, the site silently omits the change —
# so fail loudly instead. The generator uses only Node builtins; no install needed.
on:
  push:
    branches: [main]
    paths: ['paws/**/vole-paw.json', 'paws/**/package.json', 'scripts/build-index.mjs', 'INDEX.json']
  pull_request:
    paths: ['paws/**/vole-paw.json', 'paws/**/package.json', 'scripts/build-index.mjs', 'INDEX.json']

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-index.mjs --check
